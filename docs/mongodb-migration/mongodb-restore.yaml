apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open5gs-mongodb-restored
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-restore
  template:
    metadata:
      labels:
        app: mongodb-restore
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: docker.io/library/mongo:8.0.34
          command: ["mongod"]
          args: ["--bind_ip", "127.0.0.1", "--dbpath", "/data/db"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1})"]
          volumeMounts:
            - name: restored
              mountPath: /data/db
      volumes:
        - name: restored
          persistentVolumeClaim:
            claimName: open5gs-mongodb-restored
