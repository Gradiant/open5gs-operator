apiVersion: net.gradiant.org/v1
kind: Open5GS
metadata:
  name: open5gs-sample
spec:
  webuiAdminSecret: webui-admin
  webui:
    enabled: true
  ausf:
    serviceAccount: false
  upf:
    resources:
      requests:
        cpu: 75m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
  configuration:
    slices:
      - sst: "1"
        sd: "111111"
      - sst: "2"
        sd: "222222"
